name: Verify Ashen Age 3D

on:
  push:
    branches: ["ashen-age-repair"]
    paths: ["games/ashen-age/**", ".github/workflows/ashen-age-qa.yml"]
  workflow_dispatch:
  workflow_run:
    workflows: ["Deploy GitHub Pages"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ashen-age-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-test:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Prepare pinned same-origin game assets
        run: |
          python -m pip install Pillow==12.0.0 --disable-pip-version-check
          python games/ashen-age/scripts/prepare_assets.py
      - name: Install isolated browser test tools
        run: |
          timeout 120s npm install --no-save --prefix /tmp/ashen-browser playwright@1.56.1
          command -v google-chrome
      - name: Install bundled Chinese font for visual review
        run: |
          mkdir -p "$HOME/.local/share/fonts/ashen-qa"
          cp games/ashen-age/tests/fonts/AshenQACJK.otf "$HOME/.local/share/fonts/ashen-qa/"
          fc-cache -f "$HOME/.local/share/fonts/ashen-qa"
      - name: Render and exercise the actual game
        env:
          NODE_PATH: /tmp/ashen-browser/node_modules
          CHROMIUM_PATH: /usr/bin/google-chrome
          CHARACTER_FIXTURE_URL: http://127.0.0.1:4173/games/ashen-age/tests/characters.html
          GAME_URL: ${{ github.event_name == 'workflow_run' && 'https://bert-lynn.github.io/my-website/games/ashen-age/' || '' }}
          QA_DEPLOYMENT_SMOKE: ${{ github.event_name == 'workflow_run' && '1' || '0' }}
          QA_SUITE: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-combat]') && 'combat.cjs' || '' }}
          QA_OUTPUT: ${{ runner.temp }}/ashen-age-qa
        run: node games/ashen-age/tests/serve-and-test.cjs
      - name: Upload visual evidence and assertions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ashen-age-browser-evidence
          path: ${{ runner.temp }}/ashen-age-qa
          retention-days: 7
