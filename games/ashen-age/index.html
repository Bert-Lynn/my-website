window.openComp=()=>open('伙伴与羁绊',companionHTML());
function interact(kind){if(kind==='guild'){open('灰烬镇冒险者公会','<p>告示板上钉满了委托。公会大厅里，冒险者们交换着遗迹、魔物和失踪商队的消息。</p><div class="cards"><div class="card"><h4>新手委托：腐化狼群</h4><p>清理镇外林地的腐化狼，击败三只并返回报告。</p><span class="tag">60 金币</span><span class="tag">80 经验</span><button class="btn" onclick="window.acceptQuest()">接受委托 / 交付</button></div><div class="card"><h4>古井异响</h4><p>旧城区封井每到午夜都会传来低语。</p><span class="tag">未解锁</span></div></div><button class="btn" onclick="window.openComp()">伙伴档案</button>')}
if(kind==='tavern'){open('旅人酒馆 · 暖炉与麦酒','<p>炉火噼啪作响，吟游诗人弹着北境巨龙的古老歌谣。这里总能听到不该出现在告示板上的消息。</p><div class="cards"><div class="card"><h4>请伙伴喝一杯</h4><p>和同行伙伴聊聊过去。</p><span class="tag">12 金币</span><button class="btn" onclick="window.ale()">买一轮酒</button></div><div class="card"><h4>打听传闻</h4><p>北边古石阵的封印正在松动。</p><button class="btn" onclick="window.rumor()">打听消息</button></div><div class="card"><h4>休息一晚</h4><p>恢复生命与法力。</p><span class="tag">8 金币</span><button class="btn" onclick="window.rest()">入住客房</button></div></div>')}
if(kind==='smith'){open('铁匠铺','<p>铁匠乌尔夫：“想让刀刃更锋利，就拿金币来。”</p><button class="btn" onclick="window.upgrade()">磨砺武器（45 金币，攻击 +5）</button><button class="btn" onclick="window.buyPotion()">购买生命药水（10 金币）</button>')}
if(kind==='merchant'){open('旅行商人','<p>几件稀奇古怪的礼物摆在货架上，每件 12 金币。</p>'+companions.map(c=>'<button class="btn" onclick="window.buyGift(\''+c.gift+'\')">'+c.gift+'</button>').join(''))}
if(['lyra','garrick','mira'].includes(kind)){let c=companions.find(x=>x.id===kind);open(c.name,'<p>'+c.desc+'</p><p>好感度：'+c.aff+'/100</p><button class="btn" onclick="window.gameTalk(\''+kind+'\')">交谈</button><button class="btn" onclick="window.openComp()">伙伴档案</button>')}}
window.acceptQuest=()=>{if(state.complete){state.gold+=60;gainXP(80);state.complete=false;state.accepted=false;state.kills=0;$('qtitle').textContent='公会新人的第一份委托';$('qdesc').textContent='腐化狼群的委托已完成。你可以继续探索。';$('objective').textContent='◆ 委托已完成'}else{state.accepted=true;state.kills=0;$('qtitle').textContent='新手委托：腐化狼群';$('qdesc').textContent='公会要求你清理镇外林地的腐化狼。带着证明回来。';$('objective').textContent='◆ 击败腐化狼 0 / 3'}close();toast('公会委托已更新')};
window.ale=()=>{if(state.gold<12){toast('金币不足');return}state.gold-=12;let c=companions.find(x=>x.id===active);c.aff=Math.min(100,c.aff+8);open('酒馆','<p>你和 '+c.name+' 分享了一杯麦酒。好感度 +8。</p>')};
window.rumor=()=>{let c=companions.find(x=>x.id===active);c.aff=Math.min(100,c.aff+2);open('酒馆传闻','<p>老板压低声音：“三天前，北边古石阵亮起了蓝色的火。那是龙陨之地的封印正在松动。”</p><span class="tag">新线索：北境古石阵</span>')};
window.rest=()=>{if(state.gold<8){toast('金币不足');return}state.gold-=8;state.hp=state.maxHp;state.mp=state.maxMp;close();toast('休息完毕，状态恢复')};
window.upgrade=()=>{if(state.gold<45){toast('金币不足');return}state.gold-=45;state.damage+=5;close();toast('武器强化成功')};
window.buyPotion=()=>{if(state.gold<10){toast('金币不足');return}state.gold-=10;state.potions++;close();toast('获得生命药水')};
window.buyGift=name=>{if(state.gold<12){toast('金币不足');return}state.gold-=12;state.inventory.push(name);close();toast('获得 '+name)};
let activeAlly=()=>companions.find(c=>c.id===active&&c.joined);
let allyClock=0;
function update(dt){let f=0,r=0;if(keys.KeyW||keys.ArrowUp)f++;if(keys.KeyS||keys.ArrowDown)f--;if(keys.KeyD||keys.ArrowRight)r++;if(keys.KeyA||keys.ArrowLeft)r--;let moving=f||r;if(moving&&!modal){let ang=Math.atan2(r,f)+yaw,dir=new THREE.Vector3(Math.sin(ang),0,Math.cos(ang)).normalize(),speed=keys.Space?10:5.4;player.position.addScaledVector(dir,speed*dt);player.rotation.y=Math.atan2(dir.x,dir.z);if(keys.Space&&dodge<=0){dodge=.35;state.mp=Math.max(0,state.mp-2)}}dodge=Math.max(0,dodge-dt);
let target=player.position.clone().add(new THREE.Vector3(Math.sin(yaw)*Math.cos(pitch)*dist,Math.sin(pitch)*dist+1.2,Math.cos(yaw)*Math.cos(pitch)*dist));camera.position.lerp(target,.18);camera.lookAt(player.position.clone().add(new THREE.Vector3(0,1.5,0)));
for(let e of enemies){if(e.userData.dead)continue;let d=e.position.distanceTo(player.position);if(d<22){if(d>1.8){let v=player.position.clone().sub(e.position).setY(0).normalize();e.position.addScaledVector(v,1.8*dt);e.rotation.y=Math.atan2(v.x,v.z)}else if(e.userData.cd<=0&&dodge<=0){e.userData.cd=1.3;state.hp-=e.userData.big?14:8;if(state.hp<=0){state.hp=state.maxHp;player.position.set(0,0,16);state.gold=Math.max(0,state.gold-10);toast('你被击倒，镇民救你回城（损失10金币）')}}}e.userData.cd=Math.max(0,e.userData.cd-dt)}
let c=activeAlly();if(c){let offset=new THREE.Vector3(-1.8,0,-2).applyAxisAngle(new THREE.Vector3(0,1,0),yaw),dest=player.position.clone().add(offset);ally.position.lerp(dest,Math.min(1,dt*3));ally.visible=true;allyClock-=dt;if(allyClock<=0){let e=enemies.find(e=>!e.userData.dead&&e.position.distanceTo(player.position)<18);if(e){allyClock=2.5;e.userData.hp-=c.id==='lyra'?12:c.id==='mira'?16:9;if(e.userData.hp<=0)kill(e)}}}else ally.visible=false;
cool=Math.max(0,cool-dt);spellCool=Math.max(0,spellCool-dt);state.mp=Math.min(state.maxMp,state.mp+dt*1.3);
nearest=interactables.map(o=>({...o,d:Math.hypot(player.position.x-o.x,player.position.z-o.z)})).sort((a,b)=>a.d-b.d)[0];$('prompt').style.display=nearest&&nearest.d<5&&!modal?'block':'none';if(nearest)$('prompt').textContent='按 E 与 '+nearest.title+' 互动';
$('hp').style.width=state.hp/state.maxHp*100+'%';$('mp').style.width=state.mp/state.maxMp*100+'%';$('xp').style.width=state.xp+'%';$('hptext').textContent=Math.ceil(state.hp)+' / '+state.maxHp;$('mptext').textContent=Math.floor(state.mp)+' / '+state.maxMp;$('xptext').textContent=state.xp+' / 100';$('lvl').textContent=String(state.level).padStart(2,'0');$('gold').textContent=state.gold;$('region').textContent=player.position.z<-35?'幽影林地':'灰烬镇'}
const clock=new THREE.Clock();function loop(){requestAnimationFrame(loop);let dt=Math.min(clock.getDelta(),.04);if(!modal)update(dt);renderer.render(scene,camera)}loop();
window.addEventListener('keydown',e=>{keys[e.code]=true;if(e.repeat)return;if(e.code==='KeyJ')hit();if(e.code==='KeyK')cast();if(e.code==='KeyE'&&!modal&&nearest&&nearest.d<5)interact(nearest.kind);if(e.code==='KeyP'&&!modal)openComp();if(e.code==='KeyI'&&!modal)open('冒险者背包','<p>金币：'+state.gold+'　生命药水：'+state.potions+'</p><p>战利品：'+(state.inventory.join('、')||'暂无')+'</p><p>旅人长剑，攻击力 '+state.damage+'</p>');if(e.code==='KeyH'&&state.potions>0&&state.hp<state.maxHp){state.potions--;state.hp=Math.min(state.maxHp,state.hp+45);toast('使用生命药水')}if(e.code==='Escape')close()});window.addEventListener('keyup',e=>keys[e.code]=false);
renderer.domElement.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY});window.addEventListener('pointerup',()=>drag=false);window.addEventListener('pointermove',e=>{if(!drag||modal)return;let dx=e.clientX-lastX,dy=e.clientY-lastY;lastX=e.clientX;lastY=e.clientY;yaw-=dx*.004;pitch=THREE.MathUtils.clamp(pitch+dy*.003,-.05,.75)});renderer.domElement.addEventListener('wheel',e=>dist=THREE.MathUtils.clamp(dist+e.deltaY*.006,3.5,10));window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
document.querySelectorAll('.mobile button').forEach(b=>{let code=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();keys[code]=true};b.onpointerup=b.onpointerleave=()=>keys[code]=false});
</script></body></html>
